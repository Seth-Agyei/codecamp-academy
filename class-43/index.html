<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
 <main>
    <h1>Javascript Data Types</h1>
 </main>


 <script>
    //here start the javascript code
    var n;
    console.log(n); //?
    console.log("The variable name Data type is: " +  typeof(n))

    var a; //undefined (automatic)
    var b = null; // null (intentional)

    /*
    undefined ==> javascript didn't assign a value
    null ==> you intentionally set "no value"
    */

    var num = 1
    console.log(num)
    console.log(typeof(num))
    
    console.log(a); //?
    console.log("The variable 'a' data type is:" + typeof(a))

    console.log(b); //?
    console.log("The variable 'b' data type is:" + typeof(b))

    //Real-world analogy
    // undefined => you ordered food, but hasn't arrived yet
    // null => ypu decide not to order anything

    console.log(c)//?
    console.log("The variable 'c' Data type is:" + typeof(c))
 
 
 </script>
</body>
</html>
